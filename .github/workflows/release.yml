name: Release ZXP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the ZXP to (e.g. v1.0.0)'
        required: true

jobs:
  build-zxp:
    # Adobe's ZXPSignCmd (bundled by vite-cep-plugin) only ships for Windows and macOS.
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      # A fresh self-signed certificate is generated on every build, so its password is a
      # throwaway value rather than a stored secret.
      - name: Build signed ZXP
        run: |
          export ZXP_PASSWORD="$(openssl rand -hex 24)"
          npm run zxp

      - name: Verify signature and rename
        run: |
          src="$(ls dist/zxp/*.zxp | head -n 1)"
          node_modules/vite-cep-plugin/lib/bin/ZXPSignCmd.exe -verify "$src"
          version="$(node -p "require('./package.json').version")"
          mkdir -p out
          cp "$src" "out/Pro-Caption-AE_${version}.zxp"
          ls -l out

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Pro Caption AE ${{ env.TAG }}
          body_path: ${{ github.event_name == 'push' && '.github/release-notes.md' || '' }}
          files: out/*.zxp
          fail_on_unmatched_files: true
